image: Visual Studio 2022

shallow_clone: true

platform:
  - x64

configuration:
  - Release

matrix:
  fast_finish: false

only_commits:
  files:
    - /engine/src/
    - /engine/vc17/
    - .appveyor.yml
    - /engine/cmake/

install:
  - cmd: cd C:\tools\vcpkg
  - cmd: git pull
  - cmd: .\bootstrap-vcpkg.bat
  - cmd: cd %APPVEYOR_BUILD_FOLDER%
  - cmd: vcpkg install

# Trocamos o 'build: parallel: true' por um script de build explícito
build_script:
  - cmd: msbuild engine\vc17\theforgottenserver.sln /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /m

after_build:
  - 7z a -tzip Otg.zip -r .\engine\vc17\*.exe -ir!.\engine\vc17\*.dll

cache:
  - c:\tools\vcpkg\installed\

artifacts:
  - path: \engine\vc17\**\theforgottenserver*.exe
  - path: \engine\vc17\**\*.dll
  - path: Otg.zip
