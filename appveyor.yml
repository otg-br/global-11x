image: Visual Studio 2022

shallow_clone: true

platform:
  - x64

configuration:
  - Release

matrix:
  fast_finish: false

only_commits:
  files:
    - /engine/src/
    - /engine/vc17/
    - .appveyor.yml
    - /engine/cmake/

install:
  # Vai até a pasta de instalação padrão do vcpkg no AppVeyor
  - cmd: cd C:\tools\vcpkg
  # Puxa as atualizações mais recentes do repositório oficial
  - cmd: git pull
  # Recompila o vcpkg para garantir que está na versão mais nova
  - cmd: .\bootstrap-vcpkg.bat
  # Volta para a pasta do seu projeto global11
  - cmd: cd %APPVEYOR_BUILD_FOLDER%
  # Finalmente, roda a instalação das bibliotecas
  - cmd: vcpkg install

build:
  parallel: true

after_build:
  - 7z a -tzip Otg.zip -r .\engine\vc17\*.exe -ir!.\engine\vc17\*.dll

cache:
  - c:\tools\vcpkg\installed\

artifacts:
  - path: \engine\vc17\**\theforgottenserver*.exe
  - path: \engine\vc17\**\*.dll
  - path: Otg.zip
